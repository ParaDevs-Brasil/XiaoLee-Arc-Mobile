name: Mobile Release

# Dispara em cada tag "mobile-vX.Y.Z": builda o APK assinado (produção) via EAS,
# publica como GitHub Release e atualiza o link de download na landing page.
on:
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build (EAS produção) · Release · Atualiza landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout da tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (perfil production-apk, assinatura de produção)
        run: |
          eas build --platform android --profile production-apk --non-interactive --wait --json > build-output.json
          cat build-output.json

      - name: Baixar APK assinado
        run: |
          BUILD_URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build-output.json','utf8'))[0].artifacts.buildUrl)")
          echo "Build URL: $BUILD_URL"
          curl -fL "$BUILD_URL" -o xiaolee.apk

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" mobile/xiaolee.apk \
            --repo "${{ github.repository }}" \
            --title "XiaoLee Mobile ${{ github.ref_name }}" \
            --notes "Build de produção gerado automaticamente pelo GitHub Actions a partir da tag ${{ github.ref_name }}."

      # A tag pode ter sido cortada de qualquer branch (develop, feature/*) — não dá pra
      # simplesmente commitar em cima do checkout da tag e empurrar pra main, isso
      # sobrescreveria main com a árvore da tag. Checkout separado de main só pra este passo.
      - name: Checkout do main (para atualizar a landing)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-checkout

      - name: Atualizar link de download na landing e publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd main-checkout
          NEW_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/xiaolee.apk"
          sed -i -E "s#https://github\.com/[^\"[:space:]]+/releases/download/[^/\"]+/xiaolee\.apk#${NEW_URL}#g" landing/index.html

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add landing/index.html

          if git diff --cached --quiet; then
            echo "Link já está atualizado, nada a commitar."
          else
            git commit -m "chore(landing): apontar download do app para ${{ github.ref_name }}"
            git push origin HEAD:main
          fi
